<div class="faq-item">
  <button type="button" class="faq-question" (click)="toggle.emit()" [attr.aria-expanded]="isOpen">
    <span class="font-heading text-left text-gray-900">{{ question }}</span>
    <i
      class="pi text-primary shrink-0 text-sm transition-transform duration-300"
      [class.pi-chevron-down]="!isOpen"
      [class.pi-chevron-up]="isOpen"
    ></i>
  </button>

  <!-- La réponse reste dans le DOM, repliée par une ligne de grille de hauteur nulle, au
       lieu d'être retirée par un @if : c'est ce qui permet la transition de hauteur, et
       surtout ce qui garde le texte dans le HTML servi — une réponse absente de la page ne
       vaudrait rien pour les moteurs, données structurées ou pas. -->
  <div
    class="grid transition-[grid-template-rows] duration-300 ease-in-out"
    [class]="isOpen ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
  >
    <div class="overflow-hidden">
      <p class="font-body px-5 pb-5 text-gray-700">{{ answer }}</p>
    </div>
  </div>
</div>

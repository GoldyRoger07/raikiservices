<div class="mx-auto flex max-w-3xl flex-col gap-3">
  @for (faq of faqs; track faq.question; let i = $index) {
    <app-faq-item
      animateOnScroll
      class="fade-up block"
      [question]="faq.question"
      [answer]="faq.answer"
      [isOpen]="openIndex() === i"
      (toggle)="handleToggle(i)"
    />
  }
</div>

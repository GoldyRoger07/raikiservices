@if (link(); as target) {
  <a [routerLink]="target" [queryParams]="queryParams()" [class]="classes()">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button [type]="type()" [class]="classes()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  <span class="btn-content flex items-center gap-1 w-fit">
    <ng-content></ng-content>
    <i class="pi pi-arrow-right translate-y-0.5" style="font-size: 18px"></i>
  </span>
</ng-template>

<my-header/>
    <my-hero-section 
    title="Les sites web que nous avons conçus" 
    desc="Découvrez les sites web sur mesure que nous avons conçus pour des entreprises à Pétion-Ville et ailleurs. Chaque projet commence par une conversation et se termine par une réalisation dont nous sommes fiers." />


    <section class="">
    <my-container>
        <div class="flex flex-col items-center w-full py-10 rounded-t-4xl">
            <separator-design></separator-design>
            <div class="text-center w-[70%] py-5">

                <!-- <span>Ce que nous faisons</span> -->
                <h2 class="font-heading text-3xl text-gray-800">Nos Projets</h2>
                <p class="font-body text-gray-700">Explorez quelques-uns des projets que nous avons réalisés pour aider des entreprises de divers secteurs à développer leur présence en ligne.</p>
            </div>
            <div class="grid grid-cols-4 gap-3 py-10">
                @for(project of projectCards; track $index){

                    <div class="w-full flex flex-col gap-2 shadow-sm hover:shadow-xl  transition-all duration-300 border border-gray-200 bg-white rounded-sm">
                        <!-- <img [src]="project.cover" class="h-50 object-contain" alt=""> -->
                        <p-image [src]="project.cover" alt="Image" [preview]="true" width="100%" >
                            <ng-template #indicator>
                                <i class="pi pi-search-plus"></i>
                            </ng-template>
                            <ng-template #image>
                                <img [src]="project.cover" alt="image" class="h-50 w-[95%] mx-auto object-contain" />
                            </ng-template>
                            <ng-template #preview let-style="style" let-previewCallback="previewCallback">
                                <img [src]="project.cover" alt="image" [style]="style" (click)="previewCallback()" />
                            </ng-template>
                        </p-image>
                        <div class="flex items-center justify-between p-5">
                            <span class="font-heading text-xl text-gray-700">{{project.title}}</span>
                            <a href="#" class="font-accent text-primary">Voir le Site</a>
                        </div>
                    </div>
                }

                <!-- <div>
                    <img src="" alt="">
                    <span>Fshop</span>
                </div>

                <div>
                    <img src="" alt="">
                    <span>Bowom</span>
                </div>

                <div>
                    <img src="" alt="">
                    <span>Michaels Restaurant</span>
                </div> -->

                

            </div>
            <!-- <my-button>Voir nos projets</my-button> -->
        </div>
    </my-container>
</section>

    <my-cta-section></my-cta-section>
<my-footer/>

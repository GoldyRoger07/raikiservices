<my-header/>

    <my-hero-section 
        title="Arrêtez de payer pour un site web que personne ne trouve." 
        desc="Nous aidons les entreprises à se positionner plus haut sur Google, à apparaître dans les recherches locales et à comprendre réellement leur trafic grâce à des analyses claires."/>

    <section class="pb-20">
        <my-container>
            <div class="flex flex-col gap-1 items-center mb-10">
                    <separator-design></separator-design>
                    <span class="font-accent text-primary">Nos Services SEO</span>
                    <h2 class="font-heading text-gray-800 text-3xl">Comment nous rendons votre entreprise visible sur Google</h2>
                    <p class="text-gray-700 font-body">Le SEO n’a rien de magique : c’est un travail technique et régulier, fait dans les règles de l’art. Voici nos axes prioritaires.</p>
            </div>

            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-2 ">
                @for(card of serviceCards; track $index){

                    <div class="flex flex-col gap-2.5 items-start justify-center border border-gray-200  text-start shadow hover:shadow-2xl transition-shadow duration-300 p-5 rounded-2xl">
                        <div [class]="'rounded-2xl flex items-center justify-center h-15 w-15 aspect-square '+getIconColor($index+1) ">
                            <i [class]="card.cover+' text-3xl'"></i>
                        </div>

                        <span class="font-heading font-bold text-gray-800 text-2xl">{{card.title}}</span>
                        <p class="font-body text-gray-700">{{card.desc}}</p>
                    </div>
                }
            </div>
        </my-container>
    </section>
    <my-cta-section></my-cta-section>
<my-footer/>
